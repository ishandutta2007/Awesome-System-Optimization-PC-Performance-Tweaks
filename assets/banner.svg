<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d192e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #1e293b; stroke-width: 1; opacity: 0.35; }
    
    /* Subtle background animations strictly kept in background */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.45; }
    }
    @keyframes wavePath {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }
    @keyframes barGlow {
      0%, 100% { height: 45px; y: 255px; opacity: 0.6; }
      50% { height: 75px; y: 225px; opacity: 0.95; }
    }
    @keyframes barGlow2 {
      0%, 100% { height: 60px; y: 240px; opacity: 0.7; }
      50% { height: 90px; y: 210px; opacity: 1; }
    }

    .ambient-orb-1 {
      animation: pulseOrb 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .ambient-orb-2 {
      animation: pulseOrb 9s ease-in-out infinite reverse;
      transform-origin: 1000px 250px;
    }
    .flow-line {
      stroke-dasharray: 20, 10;
      animation: wavePath 25s linear infinite;
    }
    .perf-bar-1 { animation: barGlow 3.5s ease-in-out infinite; }
    .perf-bar-2 { animation: barGlow2 4.2s ease-in-out infinite; }

    /* Foreground Typography */
    .title-main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .title-highlight {
      fill: url(#primaryGlow);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Background Ambient Glows -->
  <circle cx="180" cy="80" r="130" fill="#00f2fe" class="ambient-orb-1" filter="url(#neonBlur)" />
  <circle cx="1020" cy="260" r="160" fill="#7928ca" class="ambient-orb-2" filter="url(#neonBlur)" />

  <!-- Background Cyber Matrix / Tech Grid -->
  <g>
    <line x1="80" y1="0" x2="80" y2="360" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="360" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="360" class="grid-line" />
    <line x1="880" y1="0" x2="880" y2="360" class="grid-line" />
    <line x1="1040" y1="0" x2="1040" y2="360" class="grid-line" />
    
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Flowing Tech Graphic (Bottom Right Background) -->
  <path d="M 680 320 C 820 280, 920 340, 1150 210" fill="none" stroke="url(#primaryGlow)" stroke-width="2" class="flow-line" opacity="0.4" />
  <path d="M 720 340 C 860 300, 960 320, 1180 240" fill="none" stroke="url(#neonPurple)" stroke-width="2" class="flow-line" opacity="0.3" />

  <!-- Animated Performance Bar Cluster (Right Side Accent) -->
  <g opacity="0.85">
    <rect x="940" y="240" width="12" height="60" rx="4" fill="#00f2fe" class="perf-bar-1" />
    <rect x="965" y="220" width="12" height="80" rx="4" fill="#38bdf8" class="perf-bar-2" />
    <rect x="990" y="250" width="12" height="50" rx="4" fill="#818cf8" class="perf-bar-1" />
    <rect x="1015" y="210" width="12" height="90" rx="4" fill="#c084fc" class="perf-bar-2" />
    <rect x="1040" y="235" width="12" height="65" rx="4" fill="#f43f5e" class="perf-bar-1" />
  </g>

  <!-- Metric Pill / Tag (Foreground) -->
  <g transform="translate(80, 48)">
    <rect width="265" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#00f2fe" />
    <text x="30" y="20" class="badge-text">⚡ ULTRA PERFORMANCE ECOSYSTEM</text>
  </g>

  <!-- MAIN FOREGROUND HEADINGS -->
  <text x="80" y="132" class="title-main">
    System Optimization &amp; <tspan class="title-highlight">PC Performance Tweaks</tspan>
  </text>
  
  <text x="80" y="174" class="subtitle">
    Curated Hub of Open-Source Tweakers, Debloating Utilities, Latency Reducers &amp; Commercial Tune-Up Suites
  </text>

  <!-- FEATURE CARDS (Foreground Badges) -->
  <!-- Card 1 -->
  <g transform="translate(80, 215)">
    <rect width="210" height="72" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">🚀 OS Debloating</text>
    <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Telemetry, UWP &amp; Services</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(305, 215)">
    <rect width="210" height="72" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#a855f7">🧹 Disk &amp; Registry</text>
    <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Deep junk removal &amp; uninstalls</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(530, 215)">
    <rect width="210" height="72" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#34d399">🎮 Gaming Latency</text>
    <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Power plans &amp; CPU priorities</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(755, 215)">
    <rect width="165" height="72" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">🔒 Privacy Hardening</text>
    <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Transparent &amp; auditable</text>
  </g>

  <!-- Border Accent Top Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#primaryGlow)" rx="1.5" />
</svg>
