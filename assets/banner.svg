<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d192e"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="neonPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7928ca"/><stop offset="100%" stop-color="#ff0080"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="neonBlur" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="15"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.25}50%{transform:scale(1.15) translate(-20px,15px);opacity:.45}}@keyframes wavePath{0%{stroke-dashoffset:0}}@keyframes barGlow{0%{height:45px;y:255px;opacity:.6}50%{height:75px;y:225px;opacity:.95}}@keyframes barGlow2{0%{height:60px;y:240px;opacity:.7}50%{height:90px;y:210px;opacity:1}}.bg{fill:url(#bgGrad)}.grid-line{stroke:#1e293b;stroke-width:1;opacity:.35}.ambient-orb-1{animation:pulseOrb 7s ease-in-out infinite;transform-origin:200px 100px}.ambient-orb-2{animation:pulseOrb 9s ease-in-out infinite reverse;transform-origin:1000px 250px}.flow-line{stroke-dasharray:20,10;animation:wavePath 25s linear infinite}.perf-bar-1{animation:barGlow 3.5s ease-in-out infinite}.perf-bar-2{animation:barGlow2 4.2s ease-in-out infinite}.title-main{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:38px;letter-spacing:-.5